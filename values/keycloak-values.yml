# helm upgrade --install keycloak oci://registry-1.docker.io/bitnamicharts/keycloak   -f keycloak-values.yml   --namespace keycloak --create-namespace 

auth:
  adminUser: admin
  adminPassword: adminpassword

postgresql:
  enabled: true
  auth:
    username: bn_keycloak
    password: keycloakdbpass
    database: bitnami_keycloak

service:
  type: ClusterIP
  ports:
    http: 8080
    https: 8443

ingress:
  enabled: true
  ingressClassName: nginx
  pathType: ImplementationSpecific
  hosts:
    - name: keycloak.local
      path: /keycloak(/|$)(.*)   # ловим все запросы по /keycloak
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2   # переписываем путь для Keycloak
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"


replicaCount: 1

extraVolumes:
  - name: realm-config
    configMap:
      name: keycloak-realm-config

extraVolumeMounts:
  - name: realm-config
    mountPath: /realm-config
    readOnly: true



extraEnvVars:
  - name: KEYCLOAK_IMPORT
    value: "/realm-config/realm-export.json"
  - name: KEYCLOAK_FRONTEND_URL
    value: https://keycloak.local/keycloak
  - name: PROXY_ADDRESS_FORWARDING
    value: "true"