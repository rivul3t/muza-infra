# helm install postgres oci://registry-1.docker.io/bitnamicharts/postgresql -f postgres-keycloak-values.yml --namespace keycloak --create-namespace

replicaCount: 1

auth:
  existingSecret: postgres-secret
  username: keycloak
  database: keycloak

primary:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""



replica:
  enabled: false

metrics:
  enabled: false

service:
  type: ClusterIP
  port: 5432