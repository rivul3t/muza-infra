# helm repo add victoria-metrics https://victoriametrics.github.io/helm-charts/
# helm repo update
# helm upgrade --install vmagent victoria-metrics/victoria-metrics-agent --namespace monitoring -f vmagent-values.yml

mode: daemonSet

env:
  - name: KUBE_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

remoteWrite:
  - url: http://victoria-metrics-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write

config:
  global:
    scrape_interval: 10s

  scrape_configs:
    - job_name: vmagent
      static_configs:
        - targets: ["node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100"]

    - job_name: 'muse'
      metrics_path: '/api/actuator/prometheus'
      static_configs:
        - targets: ["muse.muse.svc.cluster.local:8080"]
